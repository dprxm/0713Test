<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>월별 전력 수급 현황 시각화</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        select { margin-bottom: 20px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>연도별 월별 전력 수급 현황</h1>
        <label for="yearSelect">연도 선택: </label>
        <select id="yearSelect"></select>
        <canvas id="powerChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('powerChart').getContext('2d');
        let powerChart;
        let csvData = [];

        // CSV 파일 로드
        Papa.parse('HOME_전력수급_최대_최소전력월별평균.csv', {
            download: true,
            header: true,
            complete: function(results) {
                csvData = results.data;
                initDropdown();
                updateChart(csvData[0].연도);
            }
        });

        function initDropdown() {
            const select = document.getElementById('yearSelect');
            csvData.forEach(row => {
                if (!row.연도) return;
                const opt = document.createElement('option');
                opt.value = row.연도;
                opt.innerHTML = row.연도;
                select.appendChild(opt);
            });
            select.onchange = (e) => updateChart(e.target.value);
        }

        function updateChart(year) {
            const row = csvData.find(r => r.연도 == year);
            const labels = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            const data = labels.map(m => parseFloat(row[m]) || 0);

            if (powerChart) powerChart.destroy();

            powerChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: year + '년 전력 수급량',
                        data: data,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                }
            });
        }
    </script>
</body>
</html>
